<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idle Sats</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
    .card { background: #1e1e1e; border-radius: 8px; padding: 20px; max-width: 400px; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    input { width: 80%; padding: 10px; margin: 8px 0; border-radius: 4px; border: 1px solid #333; background: #222; color: #fff; }
    button { padding: 10px 20px; margin: 5px; border: none; border-radius: 4px; background: #f2a900; color: #000; font-weight: bold; cursor: pointer; }
    button:hover { background: #d49300; }
    button:disabled { background: #555; color: #888; cursor: not-allowed; }
    #authStatus { color: #ff5555; margin-top: 10px; font-size: 14px; }
    .stat { font-size: 18px; margin: 10px 0; }
    #progress-container { width: 100%; background: #333; border-radius: 5px; height: 10px; margin: 15px 0; overflow: hidden; }
    #progress { width: 0%; height: 100%; background: #f2a900; transition: width 0.1s linear; }
    #adOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; flex-direction: column; }
    #offline { color: #4caf50; font-weight: bold; margin: 10px 0; }
  </style>
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="authScreen" class="card">
    <h2>? Idle Sats Login</h2>
    <input type="email" id="email" placeholder="Email Address">
    <input type="password" id="password" placeholder="Password (min 6 chars)">
    <br>
    <button id="login">Log In</button>
    <button id="signup">Sign Up</button>
    <div id="authStatus"></div>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen" class="card" style="display: none;">
    <h2>? Idle Sats ?</h2>
    <p>Account: <span id="userEmail"></span></p>
    <button id="logout">Log Out</button>
    <hr>
    
    <div id="offline"></div>
    
    <div class="stat">Sats: <strong><span id="sats">0</span></strong></div>
    <div class="stat">Production: <strong><span id="rate">1</span></strong> sats/sec</div>
    <div class="stat">Level: <strong><span id="level">1</span></strong></div>

    <div id="progress-container"><div id="progress"></div></div>

    <button id="mine">?? Mine +10 Sats</button>
    <br><br>
    <button id="upgrade">? Upgrade Rig (Cost: <span id="cost">50</span> Sats)</button>
    <br><br>
    <button id="daily">?? Claim 100 Daily Sats</button>
    <button id="reward">?? Watch Ad for +50 Sats</button>
    <br><br>
    <button id="reset" style="background: #e53935; color: white;">Reset Game</button>
  </div>

  <!-- AD OVERLAY -->
  <div id="adOverlay">
    <h2>Watching Advertisement...</h2>
    <p id="adStatus">Please wait 3 seconds...</p>
    <button id="closeAd">Collect +50 Sats</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="game.js" defer></script>
</body>
</html>
